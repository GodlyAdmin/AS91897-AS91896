<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>{% block title %}Glorified Pizzas{% endblock %}</title>
</head>
<body>

<header>
    <h1>Glorified Pizzas</h1>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('menu') }}">Menu</a>

<main>

<footer>

</footer>

</body>
