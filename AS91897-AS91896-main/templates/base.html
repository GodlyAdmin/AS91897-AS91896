<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta charset="UTF-8">
    <title>{% block title %}Glorified Pizzas{% endblock %}</title>
</head>
<body>

<header>
    <h1>Glorified Pizzas</h1>    
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('menu') }}">Menu</a>
        <a href="{{ url_for('order_history') }}">Order History</a>       
    </nav>
    <div class="header-actions">
        <div class="cart">
            <a href="{{ url_for('checkout') }}">Cart</a>
        </div>
        <div class="login">
            <a href="{{ url_for('login') }}">Login</a>
        </div>    
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>&copy; 2026 Glorified Pizzas</p>
</footer>

</body>
</html>
